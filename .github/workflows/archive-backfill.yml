name: Archive backfill retry

# Weekly retry for the owner-history recovery pass (/api/cron/archive). The
# pass is deadline-bounded (45 s of engine budget per run) and idempotent, so
# repeated runs walk the catalog forward: snapshots already recovered dedupe
# away (skippedDuplicate / skippedNotEarlierThanMeasured) and a rerun over a
# fully covered catalog records "ok", not degraded — capturesFetched is 0
# there, so the "fetched but recovered nothing" degraded arm never fires.
#
# WHY A RETRY EXISTS — measured on 2026-10-04: web.archive.org hung on the CDX
# index queries (1.7 s, 6.7 s, then > 20 s for the same request), so runs kept
# marking sources unavailable with nothing recovered. Once the archive
# responds reliably again this job recovers the remaining history without a
# human remembering the pass exists.
#
# WHAT THE SOURCES ACTUALLY HOLD — measured on 2026-10-04 against the live CDX:
# potat.app/badges/* has ZERO captures, and the pages are 484-byte SPA shells
# anyway (owner counts are fetched client-side from api.potat.app), so nothing
# there is parseable regardless. badgebase.de IS archived and its detail pages
# ARE server-rendered — but its first detail mementos start 2026-09-02, INSIDE
# the window this site has measured itself since 2025, so the engine's
# strictly-earlier-than-measured invariant skips every capture that exists
# today. The only residual yield is a narrow race: a badgebase capture landing
# between a new badge's page creation and this site's first measurement (hours
# to days). If Monday runs confirm capturesRecovered stays 0, the feature is
# proven starved and should be retired rather than rescheduled.
on:
  schedule:
    # Mondays, offset minute away from the Vercel crons (06:00/06:30) and the
    # potat workflow (:07). Weekly cadence: GitHub's queue lag is hours, which
    # is irrelevant here.
    - cron: "23 4 * * 1"
  workflow_dispatch: {}

concurrency:
  group: archive-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger archive owner-history backfill
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          status="$(curl -s -o response.json -w "%{http_code}" \
            --max-time 240 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://twitch-badges-database.vercel.app/api/cron/archive")"
          echo "HTTP ${status}"
          cat response.json
          echo
          test "$status" = "200"
