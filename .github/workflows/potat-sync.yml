name: Stats sync (potat)

# 15-minute owner-stats / rarity / status-sync cadence. The Vercel Hobby plan
# only allows 2 daily cron jobs, so GitHub Actions carries the high-frequency
# schedule and calls the same authenticated endpoint.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: potat-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger potat stats sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          status="$(curl -s -o response.json -w "%{http_code}" \
            --max-time 240 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://twitch-badges-database.vercel.app/api/cron/potat")"
          echo "HTTP ${status}"
          cat response.json
          echo
          test "$status" = "200"
