<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brainstorm-Ideen — Bewertung & Priorisierung</title>
<meta name="robots" content="noindex">
<style>
:root { --bg:#0f172a; --surface:#1e293b; --surface2:#334155; --text:#e2e8f0; --muted:#94a3b8; --accent:#818cf8; --line:#334155; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; padding: 2rem 1rem; max-width: 1400px; margin: 0 auto; }
h1 { font-size: 1.75rem; margin-bottom: .25rem; }
.sub { color: var(--muted); font-size: .875rem; margin-bottom: 1.5rem; }
.filters { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.5rem; }
.cat-btn { background: var(--surface); border: 1px solid var(--line); color: var(--text); padding: .375rem .75rem; border-radius: 999px; cursor: pointer; font-size: .8125rem; font-weight: 500; transition: all .15s; }
.cat-btn:hover { border-color: var(--accent); }
.cat-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
.cat-btn .count { opacity: .7; font-size: .75rem; margin-left: .25rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 1rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: .75rem; padding: 1rem; display: flex; flex-direction: column; gap: .5rem; transition: border-color .15s; }
.card:hover { border-color: var(--accent); }
.card.planned { border-color: #22c55e; }
.card-header { display: flex; flex-wrap: wrap; gap: .375rem; align-items: center; }
.badge-cat { font-size: .6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); background: rgba(129,140,248,.12); padding: .125rem .5rem; border-radius: .25rem; }
.badge-planned { font-size: .6875rem; font-weight: 600; color: #22c55e; background: rgba(34,197,94,.12); padding: .125rem .5rem; border-radius: .25rem; }
.badge-qw { font-size: .6875rem; font-weight: 600; color: #0f172a; padding: .125rem .5rem; border-radius: .25rem; }
h3 { font-size: .9375rem; font-weight: 600; }
details { font-size: .8125rem; color: var(--muted); }
details summary { cursor: pointer; color: var(--accent); font-size: .75rem; }
details p { margin-top: .375rem; white-space: pre-wrap; }
.metrics { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.metric { display: flex; flex-direction: column; gap: .125rem; }
.metric .label { font-size: .6875rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.bar { height: .25rem; background: var(--surface2); border-radius: .125rem; overflow: hidden; }
.bar span { display: block; height: 100%; border-radius: .125rem; }
.metric .val { font-size: .6875rem; }
.opinion { font-size: .8125rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: .5rem; margin-top: auto; }
.summary-bar { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
.stat { text-align: center; }
.stat .num { font-size: 1.5rem; font-weight: 700; }
.stat .lbl { font-size: .75rem; color: var(--muted); }
.hidden { display: none !important; }
.empty { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 2rem; }
@media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>Brainstorm-Ideen</h1>
<p class="sub">672 Ideen, sortiert nach Quick-Win-Score (Nutzen − Aufwand). Bewertung automatisch aus Kategorie + Schlüsselwörtern, dann von mir geprüft.</p>
<div class="summary-bar">
  <div class="stat"><div class="num">672</div><div class="lbl">Ideen</div></div>
  <div class="stat"><div class="num" style="color:#22c55e">250</div><div class="lbl">Quick Wins</div></div>
  <div class="stat"><div class="num" style="color:#fbbf24">345</div><div class="lbl">Neutral</div></div>
  <div class="stat"><div class="num" style="color:#f87171">77</div><div class="lbl">Aufwändig</div></div>
  <div class="stat"><div class="num" style="color:#818cf8">6</div><div class="lbl">Geplant</div></div>
</div>
<div class="filters">
  <button class="cat-btn active" data-cat="all">Alle <span class="count">672</span></button>
  <button class="cat-btn" data-cat="badge">Badges <span class="count">95</span></button>
<button class="cat-btn" data-cat="design">Design <span class="count">76</span></button>
<button class="cat-btn" data-cat="profile">Profil <span class="count">57</span></button>
<button class="cat-btn" data-cat="performance">Performance <span class="count">45</span></button>
<button class="cat-btn" data-cat="usability">Bedienbarkeit <span class="count">45</span></button>
<button class="cat-btn" data-cat="content">Content <span class="count">85</span></button>
<button class="cat-btn" data-cat="stats">Statistiken <span class="count">73</span></button>
<button class="cat-btn" data-cat="addon">Add-ons <span class="count">42</span></button>
<button class="cat-btn" data-cat="game">Spiele <span class="count">71</span></button>
<button class="cat-btn" data-cat="other">Sonstiges <span class="count">39</span></button>
<button class="cat-btn" data-cat="xp">XP <span class="count">14</span></button>
<button class="cat-btn" data-cat="coin">Coins <span class="count">15</span></button>
<button class="cat-btn" data-cat="admin">Admin <span class="count">15</span></button>
</div>
<div class="grid" id="grid">
